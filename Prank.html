<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Recovery 😂</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 100px auto;
      padding: 25px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 30px;
      font-size: 28px;
      line-height: 1.4;
    }

    .small {
      color: #999;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>WhatsApp Recovery 📱</h1>

    <p>Tap the button to recover WhatsApp 😂</p>

    <button onclick="prank()">
      Recover WhatsApp 😈
    </button>

    <div id="message">
      💀 BRO GOT TROLLED 💀
      <br><br>
      Your WhatsApp is completely safe 😂
    </div>

    <p class="small">
      Just a harmless prank.
    </p>
  </div>

  <script>
    function prank() {
      document.getElementById("message").style.display = "block";
    }
  </script>

</body>
</html>
