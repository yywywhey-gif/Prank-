<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Console</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ff66;
      font-family: monospace;
      padding: 20px;
      overflow: hidden;
    }

    #terminal {
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.6;
    }

    .bar {
      margin-top: 20px;
      border: 1px solid #00ff66;
      padding: 3px;
    }

    #progress {
      height: 18px;
      width: 0%;
      background: #00ff66;
    }

    #result {
      display: none;
      margin-top: 25px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<div id="terminal"></div>

<div class="bar">
  <div id="progress"></div>
</div>

<div id="result">
  ⚠️ ACCESS GRANTED ⚠️<br><br>
  💀 JUST A PRANK 😂
</div>

<script>
const lines = [
  "[+] Initializing secure console...",
  "[+] Connecting to server...",
  "[+] Checking encrypted packets...",
  "[+] Decrypting data...",
  "[+] Bypassing firewall...",
  "[+] Verifying access...""[+] cracking your systemmm...""[+]your cooked ishaan nayak..."
];

let i = 0;
let terminal = document.getElementById("terminal");
let progress = document.getElementById("progress");

function typeLine() {
  if (i < lines.length) {
    terminal.innerHTML += lines[i] + "\\n";
    i++;
    setTimeout(typeLine, 700);
  } else {
    let p = 0;

    let timer = setInterval(() => {
      p++;
      progress.style.width = p + "%";

      if (p >= 100) {
        clearInterval(timer);
        document.getElementById("result").style.display = "block";
      }
    }, 40);
  }
}

typeLine();
</script>

</body>
</html>
